<!DOCTYPE html>
<html>

    {% endblock stylesheets %}
  </head>
  <body class="dashboard">
    <div id="container">
      <div id="header">
        <div id="user-tools">
          <a class="header-title">
            Michael Oakeshott Bibliography
          </a>
          &nbsp; &nbsp; &nbsp;

          &nbsp;&nbsp;
          <a href="/oakeshott/about/">About</a>

      <br /><br /><br />
      <div id="content" class="colMS">

          {% block content %} {% endblock content %}
        </div>
      </div>
    </div>
  </body>
</html>
