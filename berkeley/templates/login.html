{% extends "base.html" %}
{% block content %}
    <div class="module">
        <form action="{% url 'berkeley:login' %}" method="post">
            {% csrf_token %}
            <table>
                <caption>
                    Editor login<br>
                    (Logins are given to trusted editors; there is no sign-up.)
                </caption>
                {% if form.errors %}
                <tr><td colspan="2" class="form-error">
                    Your username and password didn't match. Please try again.
                </td></tr>
                {% endif %}
                {{ form.as_table }}
            </table>
            <input type="hidden" name="next" value="{{ next }}">
            <input type="submit" value="Log in">
        </form>
    </div>
{% endblock content %}
