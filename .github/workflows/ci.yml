name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements/requirements.txt

      # the engine on its own, as a made-up site, then each real site
      # (the engine's tests again, plus the site's own)
      - name: Engine tests (made-up site)
        run: make engine_tests

      - name: Oakeshott site tests
        run: make oakeshott_tests

      - name: Voegelin site tests
        run: make voegelin_tests

  deploy:
    needs: test
    # one deploy at a time: two overlapping `git pull`s on the server left
    # its checkout half-updated on 2026-11-07
    concurrency:
      group: deploy-pythonanywhere
      cancel-in-progress: false
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to PythonAnywhere (moabiblio, Oakeshott)
        env:
          PA_PWD: ${{ secrets.PA_PWD }}
          PA_API: ${{ secrets.PA_API }}
        run: ./deploy.sh "$PA_PWD" "$PA_API"

  # the Voegelin site, on its own PythonAnywhere account (set up once by
  # bin/setup_pa_site.sh); its own concurrency group, as it is another
  # server
  deploy_voegelin:
    needs: test
    concurrency:
      group: deploy-voegelin
      cancel-in-progress: false
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to PythonAnywhere (voegelin)
        env:
          PA_PWD: ${{ secrets.VOEGELIN_PWD }}
          PA_API: ${{ secrets.VOEGELIN_API }}
          PA_USER: voegelin
          DJANGO_SETTINGS_MODULE: mysite.settings_voegelin
        run: ./deploy.sh "$PA_PWD" "$PA_API"
